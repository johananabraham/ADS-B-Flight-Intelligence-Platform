# TLS is the only network listener. Mosquitto 2.0 treats tls_version as a
# minimum, so this permits TLS 1.2 and 1.3 while rejecting older protocols.
listener 8883
protocol mqtt
tls_version tlsv1.2
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key

allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# The application contract caps payloads at 4096 bytes. Leave protocol
# overhead while rejecting unexpectedly large packets at the broker boundary.
max_packet_size 8192
max_queued_messages 1000
max_inflight_messages 20

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
