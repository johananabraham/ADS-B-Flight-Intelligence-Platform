name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          if git grep -Il -E '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,})' -- . ':!frontend/package-lock.json' | grep -q .; then
            echo "Potential credential pattern found in a tracked file."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and quality dependencies
        run: pip install -r backend/requirements.txt ruff==0.5.7 mypy==2.3.0
      - name: Lint Python
        run: ruff check backend services scripts sidecar evaluation
      - name: Type-check feeder integrity v2 packages
        env:
          PYTHONPATH: backend:.
        run: >-
          mypy --ignore-missing-imports
          backend/integrity_core sidecar evaluation/field evaluation/public_replay
      - name: Run backend tests
        env:
          PYTHONPATH: backend:.
        run: pytest -q backend/tests
      - name: Enforce synthetic kinematic baseline
        env:
          PYTHONPATH: backend:.
        run: >-
          python scripts/run_kinematic_evaluation.py --check
          --baseline evaluation/results/kinematic_rules_baseline_v1.json
      - name: Enforce short-window trajectory baseline
        env:
          PYTHONPATH: backend:.
        run: >-
          python scripts/run_windowed_kinematic_evaluation.py --check
          --baseline evaluation/results/windowed_trajectory_baseline_v1.json
      - name: Enforce frozen-policy targeted-family recall
        env:
          PYTHONPATH: backend:.
        run: >-
          python scripts/evaluate_frozen_synthetic.py
          --policy backend/integrity_core/policies/feeder-v1.json
          --cases 20 --output /tmp/frozen-policy-synthetic-v1.json
      - name: Enforce extended synthetic scenario baseline
        env:
          PYTHONPATH: backend:.
        run: >-
          python scripts/run_extended_kinematic_evaluation.py --check
          --baseline evaluation/results/kinematic_extended_baseline_v1_1.json
      - name: Enforce offline interpretable ML baseline
        env:
          PYTHONPATH: backend:.
        run: >-
          python scripts/run_ml_baselines.py --check
          --baseline evaluation/results/ml_baselines_v1.json
      - name: Enforce offline cross-source corroboration baseline
        env:
          PYTHONPATH: backend:.
        run: >-
          python scripts/run_corroboration_evaluation.py --check
          --baseline evaluation/results/corroboration_offline_v1.json
      - name: Enforce offline edge-station health baseline
        env:
          PYTHONPATH: backend:.
        run: >-
          python scripts/run_station_health_evaluation.py --check
          --baseline evaluation/results/station_health_offline_v1.json
      - name: Validate migration SQL
        working-directory: backend
        env:
          PYTHONPATH: .
        run: alembic -c alembic.ini upgrade head --sql > /tmp/migration.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:static
      - name: Verify static build has no live-network capabilities
        working-directory: .
        run: python scripts/verify_static_demo.py

  feeder-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt
      - name: Install sidecar test dependencies
        run: pip install -r sidecar/requirements.txt pytest==9.1.1 httpx2==2.9.0
      - name: Run core, transport, storage, and accelerated load gates
        env:
          PYTHONPATH: backend:.
        run: >-
          pytest -q
          backend/tests/test_integrity_core.py
          backend/tests/test_feeder_sidecar.py
          backend/tests/test_schema_import_boundary.py
      - name: Validate one-command Compose contract
        env:
          RECEIVER_ID: ci-feeder
        run: docker compose -f docker-compose.feeder.yml config --quiet
      - name: Build sidecar container
        run: docker build -f docker/Dockerfile.feeder -t feeder-integrity:test .
      - name: Verify container starts without external services
        run: >-
          docker run --rm --detach --name feeder-integrity-smoke
          --read-only --tmpfs /tmp
          --tmpfs /data/events:uid=10001,gid=10001,mode=0700
          --cap-drop ALL --security-opt no-new-privileges:true
          -e RECEIVER_ID=ci-feeder -e ADSB_INPUT_HOST=127.0.0.1
          -e SIDECAR_BIND_HOST=0.0.0.0
          -p 127.0.0.1:8090:8090 feeder-integrity:test
      - name: Wait for the read-only health endpoint
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8090/api/v1/integrity/health && exit 0
            sleep 1
          done
          docker logs feeder-integrity-smoke
          exit 1
      - name: Stop smoke container
        if: always()
        run: docker rm --force feeder-integrity-smoke || true

      - name: Scan sidecar image for critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: feeder-integrity:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure decoder
        run: cmake -S decoder -B decoder/build -DBUILD_TESTS=ON
      - name: Build decoder
        run: cmake --build decoder/build --parallel 2
      - name: Test decoder
        run: ctest --test-dir decoder/build --output-on-failure

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete reachable history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan complete reachable history for restricted artifacts
        run: python scripts/audit_release_history.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit backend Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt
      - name: Audit sidecar Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: sidecar/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Scan source and deployment configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  edge-transport-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove MQTT TLS, authentication, and least-privilege ACLs
        run: scripts/test_edge_mqtt_security.sh

  esp32-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-production CA fixture
        run: cp firmware/esp32-station/certs/broker_ca.pem.example firmware/esp32-station/certs/broker_ca.pem
      - name: Compile generic ESP32 station firmware with ESP-IDF 6.0.2
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/project" -w /project/firmware/esp32-station
          espressif/idf:v6.0.2 idf.py set-target esp32 build

  demo:
    needs: [backend, frontend, decoder]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start hardware-free demo
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build --renew-anon-volumes -d
      - name: Apply database migration
        run: docker compose exec -T backend alembic -c alembic.ini upgrade head
      - name: Verify idempotent safety-source persistence
        run: >-
          docker compose exec -T -e PYTHONPATH=/app backend
          python scripts/verify_safety_ingestion.py
      - name: Verify section-aware safety corpus lineage
        run: >-
          docker compose exec -T -e PYTHONPATH=/app backend
          python scripts/verify_safety_corpus.py
      - name: Verify the complete data path
        run: python scripts/verify_demo.py --timeout 180
      - name: Start checked-in recorded replay
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.demo.yml
          -f docker-compose.recorded.yml up --build --force-recreate -d replay ingestion
      - name: Verify recorded replay provenance and timestamps
        run: python scripts/verify_recorded_replay.py --timeout 60
      - name: Start deterministic kinematic attack replay
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.demo.yml
          -f docker-compose.recorded.yml -f docker-compose.kinematic-attack.yml
          up --build --force-recreate -d replay ingestion
      - name: Verify exact kinematic rule evidence
        run: python scripts/verify_kinematic_replay.py --timeout 60
      - name: Verify persisted trust and operator workflow
        run: python scripts/verify_trust_workflow.py
      - name: Capture service logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --no-color > demo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-service-logs
          path: demo.log
      - name: Stop demo
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
