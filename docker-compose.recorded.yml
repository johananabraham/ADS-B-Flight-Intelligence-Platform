services:
  replay:
    environment:
      REPLAY_RECORDING_PATH: /app/services/replay/recordings/columbus_generated_v1.json
      REPLAY_SPEED: 1
      REPLAY_LOOP: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)"]

  ingestion:
    environment:
      OBSERVATION_SOURCE_TYPE: RECORDED_REPLAY
      OBSERVATION_SOURCE_ID: checked-in-recording
      OBSERVATION_RECEIVER_ID: ""
      OBSERVATION_RECORDING_ID: columbus-generated-v1

  backend:
    environment:
      REPLAY_CONTROL_URL: http://replay:8081

  frontend:
    command: ./node_modules/.bin/vite --host 0.0.0.0 --config vite.recorded.config.ts
