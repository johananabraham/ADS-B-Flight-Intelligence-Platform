# Nginx load balancer configuration for Mode S Decoder cluster

events {
    worker_connections 1024;
}

http {
    # Upstream decoder instances
    upstream decoder_cluster {
        # Round-robin load balancing (default)
        server decoder1:8080;
        server decoder2:8080;
        server decoder3:8080;

        # Health check settings
        # Note: nginx-plus required for active health checks
        # Open source nginx uses passive health checks
    }

    # Logging format with upstream info
    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'upstream: $upstream_addr '
                           'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log upstream_log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # Main decode endpoint
        location /decode {
            proxy_pass http://decoder_cluster;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Retry on failure (fault tolerance)
            # /decode is a POST. Open-source nginx only retries non-idempotent
            # methods when this flag is present. Decoding is side-effect free,
            # so retrying the request against another instance is safe.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://decoder_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Metrics endpoint (aggregate from all instances)
        location /metrics {
            proxy_pass http://decoder_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Root - service info
        location / {
            proxy_pass http://decoder_cluster;
        }

        # Nginx status (for monitoring)
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }
    }
}
