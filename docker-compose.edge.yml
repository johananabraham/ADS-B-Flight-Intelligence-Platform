services:
  mqtt:
    image: eclipse-mosquitto:2.0.22-openssl
    entrypoint: ["mosquitto"]
    command: ["-c", "/mosquitto/config/mosquitto.conf"]
    container_name: adsb-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:8883:8883"
    volumes:
      - ./edge/mosquitto/config:/mosquitto/config:ro
      - ./edge/mosquitto/secrets:/mosquitto/secrets:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub --cafile /mosquitto/secrets/ca.crt -h localhost -p 8883
          -u station-consumer -P "$$(cat /mosquitto/secrets/station-consumer.password)"
          -t '$$SYS/broker/uptime' -C 1 -W 3
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  edge-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge-consumer
    container_name: adsb-edge-consumer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/adsb_intel
      MQTT_HOST: mqtt
      MQTT_PORT: "8883"
      MQTT_CONSUMER_USERNAME: station-consumer
      MQTT_CONSUMER_PASSWORD_FILE: /run/secrets/station-consumer-password
      MQTT_CA_CERT: /run/secrets/mqtt-ca
    secrets:
      - station-consumer-password
      - mqtt-ca
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

secrets:
  station-consumer-password:
    file: ./edge/mosquitto/secrets/station-consumer.password
  mqtt-ca:
    file: ./edge/mosquitto/secrets/ca.crt

volumes:
  mqtt_data:
